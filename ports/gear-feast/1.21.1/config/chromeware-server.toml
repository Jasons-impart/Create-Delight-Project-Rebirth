[systems]
	#Turn the cyberware capacity limit on or off. When on, going over the limit shows red and multiplies chrome-use Humanity loss (Cyberpsychosis > Chrome Use).
	capacity_enabled = true
	#Cyberware capacity a new player starts with. Create advancements, cyber limbs and the Chrome Compressor add more.
	# Default: 38
	# Range: 0 ~ 10000
	starting_capacity = 38

	[cyberpsychosis.humanity]
		#Turn the whole Humanity and cyberpsychosis system on or off.
		enabled = true
		#Most Humanity that installed chrome alone can take (%). Using chrome can take the rest.
		# Default: 30.0
		# Range: 0.0 ~ 100.0
		installed_chrome_cap = 30.0
		#Humanity lost for each point of installed cyberware capacity (%). Cyber limbs add their own loss (Implant stats).
		# Default: 0.08333333333333333
		# Range: 0.0 ~ 100.0
		installed_chrome_per_capacity_point = 0.08333333333333333

	[cyberpsychosis.chrome_use]
		#Permanent Humanity loss each time you use an implant, per capacity point of that implant (%). A 44-capacity Sandevistan costs 44 times this. Never wears off.
		# Default: 0.002
		# Range: 0.0 ~ 100.0
		per_implant_use = 0.002
		#Permanent Humanity loss for each creature an arm implant hits (%).
		# Default: 0.015
		# Range: 0.0 ~ 100.0
		per_arm_hardware_hit = 0.015
		#Permanent Humanity loss for each RAM spent on a quickhack (%).
		# Default: 0.0016
		# Range: 0.0 ~ 100.0
		per_quickhack_ram = 0.0016
		#All chrome-use loss is multiplied by used capacity / capacity limit. Each point over the limit counts this many extra times (needs the capacity limit on in Systems).
		# Default: 4.0
		# Range: 0.0 ~ 1000.0
		overflow_multiplier = 4.0
		#Removing chrome turns its share of chrome-use loss into strain. Installing any chrome while you still carry strain turns all of it back into permanent loss, times this.
		# Default: 1.25
		# Range: 0.0 ~ 100.0
		reinstall_penalty = 1.25

	[cyberpsychosis.strain]
		#Strain (temporary Humanity loss) recovered per minute. Paused while Cyberpsycho.
		# Default: 0.5
		# Range: 0.0 ~ 6000.0
		recovery_per_minute = 0.5
		#Strain recovery is multiplied by this while one of your tamed animals is near.
		# Default: 2.0
		# Range: 0.0 ~ 100.0
		pet_recovery_multiplier = 2.0
		#Blocks a tamed animal can be from you to count as near.
		# Default: 8.0
		# Range: 0.0 ~ 64.0
		pet_range = 8.0
		#Strain for killing a creature (%).
		# Default: 0.25
		# Range: 0.0 ~ 100.0
		creature_kill = 0.25
		#Strain for killing a player, villager, wandering trader or someone else's pet (%).
		# Default: 1.0
		# Range: 0.0 ~ 100.0
		person_kill = 1.0
		#Strain when your tamed animal dies (%).
		# Default: 15.0
		# Range: 0.0 ~ 100.0
		own_pet_died = 15.0
		#Strain when you kill your own tamed animal, instead of the above (%).
		# Default: 30.0
		# Range: 0.0 ~ 100.0
		own_pet_killed_by_you = 30.0

	[cyberpsychosis.stages]
		#Episodes start at this Humanity (%): short glitches, with your eyes glitching for others.
		# Default: 60.0
		# Range: 1.0 ~ 100.0
		flickers_below_humanity = 60.0
		#From this Humanity (%) episodes can also zone you out (longer distortion, muffled sound) and show hallucinations.
		# Default: 40.0
		# Range: 0.0 ~ 100.0
		spacing_out_below_humanity = 40.0
		#From this Humanity (%) episodes can also force attacks, and using implants can Short Circuit you.
		# Default: 20.0
		# Range: 0.0 ~ 100.0
		losing_control_below_humanity = 20.0
		#At 0% Humanity you become a Cyberpsycho. Dying ends it and leaves you at this Humanity (%).
		# Default: 10.0
		# Range: 0.0 ~ 100.0
		humanity_after_cyberpsycho_death = 10.0

	[cyberpsychosis.episodes]
		#Chance of an episode each second when episodes start (%).
		# Default: 1.0
		# Range: 0.001 ~ 100.0
		chance_per_second_at_start = 1.0
		#Chance of an episode each second near 0% Humanity (%). It rises smoothly between the two.
		# Default: 50.0
		# Range: 0.001 ~ 100.0
		chance_per_second_near_zero = 50.0
		#Once spacing out: chance an episode zones you out (%).
		# Default: 50.0
		# Range: 0.0 ~ 100.0
		spacing_out_chance = 50.0
		#Once spacing out: chance an episode shows a hallucination (another player, a dead pet, a Wither or Warden) (%).
		# Default: 50.0
		# Range: 0.0 ~ 100.0
		hallucination_chance = 50.0
		#Once losing control: chance an episode makes you attack whatever you look at (%).
		# Default: 25.0
		# Range: 0.0 ~ 100.0
		forced_attack_chance = 25.0
		#The same chance near 0% Humanity (%).
		# Default: 60.0
		# Range: 0.0 ~ 100.0
		forced_attack_chance_near_zero = 60.0
		#How long a forced attack keeps clicking when losing control starts.
		# Default: 1.0
		# Range: 0.0 ~ 60.0
		forced_attack_seconds = 1.0
		#How long a forced attack keeps clicking near 0% Humanity.
		# Default: 3.0
		# Range: 0.0 ~ 60.0
		forced_attack_seconds_near_zero = 3.0
		#Once losing control: chance an implant use Short Circuits you, rising from 0 to this near 0% Humanity (%).
		# Default: 25.0
		# Range: 0.0 ~ 100.0
		short_circuit_chance_near_zero = 25.0
		#Least seconds between two implant Short Circuits.
		# Default: 5.0
		# Range: 0.0 ~ 3600.0
		short_circuit_cooldown_seconds = 5.0

	[cyberpsychosis.immunosuppressants]
		#Humanity loss a Standard dose clears (%). Strain goes first, then permanent loss.
		# Default: 50.0
		# Range: 0.0 ~ 100.0
		standard_clears_percent = 50.0
		#Minutes a Standard dose keeps it cleared. Standard cannot end the Cyberpsycho state.
		# Default: 50.0
		# Range: 0.01 ~ 1440.0
		standard_minutes = 50.0
		#When a Standard dose wears off, seconds for each 1% to come back.
		# Default: 5.0
		# Range: 0.05 ~ 3600.0
		standard_return_seconds_per_percent = 5.0
		#Humanity loss a Military dose clears (%). Strain goes first, then permanent loss.
		# Default: 100.0
		# Range: 0.0 ~ 100.0
		military_clears_percent = 100.0
		#Minutes a Military dose keeps it cleared. Military ends the Cyberpsycho state.
		# Default: 10.0
		# Range: 0.01 ~ 1440.0
		military_minutes = 10.0
		#When a Military dose wears off, seconds for each 1% to come back.
		# Default: 1.0
		# Range: 0.05 ~ 3600.0
		military_return_seconds_per_percent = 1.0

[bosses]
	#Mobs with at least this max health count as bosses.
	# Default: 150.0
	# Range: 1.0 ~ 1000000.0
	boss_max_health = 150.0
	#Suicide, System Collapse and lone Cyberpsychosis damage to a boss, as a fraction of its max health.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	lethal_damage_fraction = 0.25
	#Blackwall Gateway damage to a boss, as a fraction of its max health.
	# Default: 0.4
	# Range: 0.0 ~ 1.0
	blackwall_damage_fraction = 0.4
	#RAM cost multiplier for lethal quickhacks on bosses.
	# Default: 1.5
	# Range: 1.0 ~ 10.0
	lethal_ram_multiplier = 1.5
	#Seconds before a boss can take another lethal quickhack.
	# Default: 10.0
	# Range: 0.0 ~ 3600.0
	lethal_cooldown_seconds = 10.0

